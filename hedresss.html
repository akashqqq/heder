<!-- =========================================================
MOBILE MENU + MOBILE DISPLAY FIX ONLY
කිසිම EXISTING DESIGN එකක් වෙනස් කරලා නැහැ
මේ CODE එක ඔබේ CURRENT CODE එකේ </script> එකට කලින් ADD කරන්න
========================================================= -->

<style>

/* =========================================================
MOBILE PERFECT VIEW FIX
========================================================= */

@media screen and (max-width:768px){

html,
body{
width:100%!important;
overflow-x:hidden!important;
-webkit-text-size-adjust:100%!important;
}

/* MOBILE HEADER */
.adl-mobile-view{
display:block!important;
width:100%!important;
overflow:hidden!important;
position:relative!important;
padding-top:125px!important;
background:#fff!important;
}

/* MOBILE TOP BAR */
.adl-shein-header-mob{
width:100%!important;
left:0!important;
top:0!important;
overflow:hidden!important;
}

/* MOBILE SEARCH */
.adl-mobile-search-box{
width:100%!important;
box-sizing:border-box!important;
background:#fff!important;
}

/* MOBILE SEARCH RESULT */
.adl-mobile-view .adl-live-search-results{
width:calc(100% - 30px)!important;
left:15px!important;
right:15px!important;
box-sizing:border-box!important;
}

/* MOBILE CATEGORY BAR */
.adl-mobile-cat-bar{
width:100%!important;
overflow-x:auto!important;
-webkit-overflow-scrolling:touch!important;
scroll-behavior:smooth!important;
padding-bottom:8px!important;
}

/* MOBILE CATEGORY ITEM */
.adl-mobile-cat-item{
flex-shrink:0!important;
}

/* MOBILE BOTTOM NAV */
.adl-mobile-bottom-nav{
width:100%!important;
left:0!important;
right:0!important;
bottom:0!important;
}

/* SIDE MENU FIX */
#sideMenu{
position:fixed!important;
top:0!important;
left:-100%!important;
width:85%!important;
max-width:320px!important;
height:100%!important;
background:#fff!important;
overflow-y:auto!important;
-webkit-overflow-scrolling:touch!important;
transition:0.35s ease!important;
z-index:999999999!important;
}

/* MENU OPEN */
#sideMenu.active{
left:0!important;
}

/* OVERLAY */
#overlay-mob{
display:none;
position:fixed!important;
top:0!important;
left:0!important;
width:100%!important;
height:100%!important;
background:rgba(0,0,0,0.5)!important;
z-index:999999998!important;
}

/* OVERLAY ACTIVE */
#overlay-mob.active{
display:block!important;
}

/* BODY LOCK */
body.adl-menu-open{
overflow:hidden!important;
height:100vh!important;
}

/* MOBILE MENU ITEMS */
.mobile-nav-item{
width:100%!important;
box-sizing:border-box!important;
}

/* TOUCH FIX */
*{
-webkit-tap-highlight-color:transparent!important;
}

}

</style>

<script>

/* =========================================================
PERFECT MOBILE MENU TOGGLE
========================================================= */

function toggleMobMenu(){

var menu = document.getElementById("sideMenu");
var overlay = document.getElementById("overlay-mob");

if(menu.classList.contains("active")){

menu.classList.remove("active");
overlay.classList.remove("active");

document.body.classList.remove("adl-menu-open");

menu.style.left = "-100%";
overlay.style.display = "none";

}else{

menu.classList.add("active");
overlay.classList.add("active");

document.body.classList.add("adl-menu-open");

menu.style.left = "0";
overlay.style.display = "block";

}

}

/* =========================================================
AUTO CLOSE MENU AFTER CATEGORY CLICK
========================================================= */

document.addEventListener("DOMContentLoaded",function(){

document.querySelectorAll(".mobile-nav-item").forEach(function(item){

item.addEventListener("click",function(){

document.getElementById("sideMenu").classList.remove("active");

document.getElementById("overlay-mob").classList.remove("active");

document.getElementById("sideMenu").style.left="-100%";

document.getElementById("overlay-mob").style.display="none";

document.body.classList.remove("adl-menu-open");

});

});

});

/* =========================================================
FORCE MOBILE HEADER PERFECT VIEW
========================================================= */

window.addEventListener("load",function(){

document.body.style.overflowX="hidden";

const mobHeader=document.querySelector(".adl-shein-header-mob");

if(mobHeader){
mobHeader.style.width="100%";
mobHeader.style.left="0";
}

});

/* =========================================================
MOBILE TOUCH SMOOTH FIX
========================================================= */

document.addEventListener("touchstart",function(){},{passive:true});
document.addEventListener("touchmove",function(){},{passive:true});

</script>
