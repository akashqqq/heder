/* --- ADLEST PREMIUM SLEEK BLACK BOTTOM SECTION FIXED --- */
:root {
    --bg-black: #000000;
    --text-white: #ffffff;
    --grey-text: #bbbbbb;
    --border-grey: #333333;
}

.adlest-bottom-section {
    background-color: var(--bg-black);
    color: var(--text-white);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    padding: 30px 0 0 0;
    width: 100%;
    box-sizing: border-box;
    border-top: 1px solid var(--border-grey);
}

.bottom-main-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px;
    box-sizing: border-box;
}

.bottom-layout-top {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 30px;
    gap: 20px;
}

.bottom-col {
    min-width: 150px;
}

.bottom-col h4 {
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    margin: 0 0 15px 0;
    color: var(--text-white);
    letter-spacing: 0.5px;
}

.bottom-nav-links {
    list-style: none;
    padding: 0;
    margin: 0;
}

.bottom-nav-links li {
    margin-bottom: 8px;
}

.bottom-nav-links a {
    text-decoration: none;
    color: var(--grey-text);
    font-size: 13px;
    transition: color 0.2s;
}

.bottom-nav-links a:hover {
    color: var(--text-white);
}

/* Social Icons */
.social-icons-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.social-row {
    display: flex;
    gap: 15px;
}

.social-row a { 
    font-size: 22px; 
    text-decoration: none;
}

/* Brands Original Colors */
.fa-facebook { color: #1877F2; }
.fa-instagram { color: #E4405F; }
.fa-tiktok { color: #ffffff; }
.fa-youtube { color: #FF0000; }
.fa-pinterest { color: #BD081C; }
.fa-linkedin { color: #0A66C2; }
.fa-snapchat { color: #FFFC00; }
.fa-threads { color: #ffffff; }

.middle-layout {
    display: flex;
    flex-direction: row-reverse; 
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 30px;
    flex-wrap: wrap;
    gap: 20px;
}

.newsletter-box {
    flex: 1;
    min-width: 300px;
}

.newsletter-box h4 {
    font-size: 11px;
    margin-bottom: 12px;
    color: var(--grey-text);
    text-align: right;
}

.input-group {
    display: flex;
    border: 1px solid var(--border-grey);
    background: #111;
    margin-left: auto;
    max-width: 350px;
}

.input-group input {
    flex: 1;
    border: none;
    padding: 12px;
    font-size: 12px;
    outline: none;
    background: transparent;
    color: white;
}

.btn-subscribe {
    background: var(--text-white);
    color: var(--bg-black);
    border: none;
    padding: 0 25px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
}

/* WE ACCEPT Box on Left Side */
.accept-container-box {
    flex: 1;
    min-width: 300px;
    border: 1px solid var(--border-grey);
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.accept-container-box h4 {
    font-size: 11px;
    margin-bottom: 15px;
    color: var(--grey-text);
    text-transform: uppercase;
}

.payment-methods-grid {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
}

.payment-methods-grid img {
    height: 22px;
    width: auto;
}

/* Bottom Full Line and Left Copyright */
.bottom-border-line {
    width: 100%;
    height: 1px;
    background-color: var(--border-grey);
}

.footer-bottom-bar {
    padding: 15px 20px;
    display: flex;
    justify-content: flex-start;
}

.copyright {
    font-size: 11px;
    color: #666;
    text-align: left;
}

/* Mobile Adjustments */
@media (max-width: 768px) {
    .bottom-layout-top { display: grid; grid-template-columns: 1fr 1fr; }
    .middle-layout { flex-direction: column; align-items: center; }
    .newsletter-box h4 { text-align: center; }
    .input-group { margin: 0 auto; }
    .copyright { text-align: center; width: 100%; }
